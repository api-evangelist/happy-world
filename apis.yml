name: Happy World
description: >-
  Happy World operates SPICE (getspice.com), a premium lifestyle dining and
  rewards mobile application based in Riyadh, Saudi Arabia. SPICE lets diners
  discover curated partner restaurants across the Kingdom, reserve or walk in,
  pay their bill in-app by entering the bill number, and earn instant cashback
  rewards (advertised as up to 20% cashback with no caps) on every visit. The
  product emphasizes intelligent personalization and a hand-picked selection of
  the best restaurants, food, and dining experiences. Surfaced as a portfolio
  company of 500 Global and added to the API Evangelist network. The company is
  a consumer mobile-app business with no public API, developer portal, SDKs, or
  documented developer surface at this time; this profile captures its identity
  and public web properties.
